{% extends "base.html" %}

{% block title %}Acceso — Moonshine Ballad{% endblock %}
{% block nav_login %}active{% endblock %}

{% block content %}
<div class="auth-box">
  <h2 style="font-family: Georgia, serif; text-align: center; margin-bottom: 1.5rem; color: var(--accent-gold);">Iniciar Sesión</h2>
  
  <form onsubmit="event.preventDefault(); alert('POST /auth/login -> Devuelve JWT Token');">
    <div class="form-group">
      <label>Correo Electrónico</label>
      <input type="email" class="form-control" placeholder="cliente@ejemplo.com" required>
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" class="form-control" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-primary">Ingresar</button>
  </form>
</div>
{% endblock %}
