<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Moonshine Ballad{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="https://github.com/caudex-nox/moonshine-ballad" class="brand" aria-label="Moonshine Ballad | Repositorio">
      <img src="/static/img/gh-dark.svg" alt="Moonshine Ballad | Repositorio">
    </a>

    <div class="nav-links">
      <a href="/store" class="nav-btn {% block nav_store %}{% endblock %}">Tienda</a>
      <a href="/admin" class="nav-btn {% block nav_admin %}{% endblock %}">Admin</a>
      <label class="active-user">
        <span>Usuario activo</span>
        <select id="activeUserSelector" aria-label="Seleccionar usuario activo">
          <option value="">Seleccionar cliente</option>
        </select>
      </label>
      <button onclick="toggleCart()" class="cart-btn">
        🛒 Carrito <span id="cartCount" class="cart-badge">0</span>
      </button>
    </div>
  </nav>
  <div id="frontNotice" class="front-notice" role="status" aria-live="polite"></div>

  <!-- Contenido Dinámico -->
  <main class="main-container">
    {% block content %}{% endblock %}
  </main>

  <!-- Overlay y Drawer del Carrito -->
  <div id="drawerOverlay" class="drawer-overlay" onclick="toggleCart()"></div>
  <aside id="cartDrawer" class="drawer">
    <div class="drawer-header">
      <h3 style="font-family: Georgia, serif;">Orden de Compra</h3>
      <button onclick="toggleCart()" class="nav-btn" style="border:none;">✕</button>
    </div>
    <div id="cartItems" class="drawer-body">
      <!-- Inyectado por JavaScript -->
    </div>
    <div class="drawer-footer">
      <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
        <span>Total:</span>
        <span id="cartTotal" style="color: var(--accent-gold); font-weight: 700;">$0</span>
      </div>
      <button class="btn-primary" onclick="checkout()">Finalizar Compra</button>
    </div>
  </aside>

  <script src="/static/js/main.js?v=20261104-image-url"></script>
</body>
</html>
